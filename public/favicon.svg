<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Escola do Pentagrama">
  <rect width="64" height="64" rx="12" fill="#090504"/>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- pentagram -->
    <path
      d="M32 10 L38.5 27.5 L57 27.5 L42 38.5 L47.5 56 L32 45 L16.5 56 L22 38.5 L7 27.5 L25.5 27.5 Z"
